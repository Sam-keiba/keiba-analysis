<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<!--
  予想ボード（段 A〜D × 脚質の4列）のドラッグできる盤（2026-10 の資料 競馬新聞.dc.html / Mobile.dc.html）。

  - 段ごとに白い角丸カード（左に段の色帯と段名）。D はカードが薄い灰で、馬は半透明＋グレースケール
  - 段の中は脚質の4列。**右から 逃げ・先行・差し・追込**（右が前）。列の中は縦に並び、上ほど前
  - 馬をドラッグして段と列を動かす。落とした場所で列の中の位置が決まる。動かした馬は緑の枠
  - 馬を押す（動かさない）と、同じページの馬柱のその馬の行へ飛ぶ

  保存の形は前の盤と同じ（board_horses / 共有ストアの board）。列は position の4区分（列の中心の値）、
  列の中の並び順は lane_offset に入れる（board.py の COLUMN_CENTERS / _assign_order）。

  Streamlitのカスタムコンポーネントの約束ごと（componentReady / render /
  setComponentValue / setFrameHeight の4つのメッセージ）だけを使う。npmもビルドも要らない。
  **ドラッグ中はStreamlitへ何も送らない**。離したときだけ保存を送る（自動保存）。
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
  :root {
    --ink: #201f1d;
    --muted: #6b6865;
    --line: #d4d1d0;
    --accent: #1a7f4b;
    --accent-100: #e6f3ec;
    --accent-300: #9acbb0;
    --tier-a: #0e6b3a;
    --tier-b: #2f9b62;
    --tier-c: #86c6a4;
    --tier-d: #a9a7a6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); background: transparent;
    font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  /* 「← 後 ／ 前 →」はボードの上に右寄せで1つだけ */
  .axis {
    display: flex; justify-content: flex-end; padding: 16px 18px 8px 0;
    font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap;
  }
  .tier {
    display: flex; margin-bottom: 12px; border-radius: 22px; overflow: hidden; background: #fff;
    border-left: 8px solid var(--tier-a); box-shadow: 0 1px 6px rgba(0,0,0,.1); user-select: none;
  }
  .tier[data-tier="B"] { border-left-color: var(--tier-b); }
  .tier[data-tier="C"] { border-left-color: var(--tier-c); }
  .tier[data-tier="D"] { border-left-color: var(--tier-d); background: #f8f4f4; }
  .tier-in { flex: 1; min-width: 0; display: flex; gap: 20px; padding: 16px 20px 18px 24px; }
  .tier-key { flex: none; width: 48px; font: 900 38px/1 'Archivo', sans-serif; color: var(--tier-a); }
  .tier[data-tier="B"] .tier-key { color: var(--tier-b); }
  .tier[data-tier="C"] .tier-key { color: var(--tier-c); }
  .tier[data-tier="D"] .tier-key { color: var(--tier-d); }
  /* 脚質の4列。row-reverse で、番号0（逃げ）が右端に来る */
  .cols { flex: 1; min-width: 0; display: flex; flex-direction: row-reverse; gap: 10px; }
  .col {
    flex: 1; min-width: 0; min-height: 44px; display: flex; flex-direction: column; gap: 6px;
    border-radius: 14px; transition: background .1s;
  }
  .col.over { background: var(--accent-100); }
  /* 馬のチップ（ピル）。枠色の馬番の丸＋馬名 */
  .chip {
    display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px 0 8px;
    border-radius: 999px; background: #fff; border: 1px solid var(--line);
    box-shadow: 0 1px 4px rgba(0,0,0,.18); cursor: grab; white-space: nowrap; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .chip .num {
    flex: none; width: 24px; height: 24px; border-radius: 999px; display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 900; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
  }
  .chip .name { min-width: 0; font-size: 14px; font-weight: 900; overflow: hidden; text-overflow: ellipsis; }
  .chip.manual { border: 2px solid var(--accent-300); }
  /* D段（＝消し）にいる馬と、前の盤で消した馬は、半透明＋グレースケール */
  .chip.dim { opacity: .5; filter: grayscale(1); }
  .chip.dim .name { color: var(--muted); }
  .chip.lifted { opacity: .3; }
  .chip.flash { outline: 3px solid var(--accent); outline-offset: 2px; }
  .ghost {
    position: fixed; z-index: 10; pointer-events: none; transform: translate(-50%, -50%);
    box-shadow: 0 8px 24px rgba(0,0,0,.3); border: 2px solid var(--accent); background: var(--accent-100);
  }

  /* --- スマホ（payload.layout = "phone"。Mobile.dc.html の縦持ちのカード） --------------------- */
  body.phone .axis { padding: 12px 10px 6px 0; font-size: 11px; }
  body.phone .tier { margin-bottom: 10px; border-radius: 18px; border-left-width: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
  body.phone .tier-in { display: block; padding: 10px 8px 12px 10px; }
  body.phone .tier-key { width: auto; font-size: 24px; }
  body.phone .cols { gap: 3px; margin-top: 10px; }
  body.phone .col { gap: 4px; }
  body.phone .chip { height: auto; min-height: 30px; gap: 2px; padding: 3px; border-radius: 15px; overflow: hidden; }
  body.phone .chip .num { width: 17px; height: 17px; font-size: 8.5px; }
  /* 馬名は1行に収める（8文字は横97%、9文字以上は横92%に縮める。palt で字間を詰める） */
  body.phone .chip .name {
    font-size: 10px; line-height: 1.15; letter-spacing: -.03em; font-feature-settings: 'palt';
    transform-origin: left center; overflow: visible; text-overflow: clip;
  }
</style>
</head>
<body>
<div id="root">
  <div class="axis">← 後 ／ 前 →</div>
  <div id="board"></div>
</div>
<script>
(function () {
  "use strict";
  // これだけ動かして初めて「ドラッグ」と見なす（押しただけのつもりを守る）
  const DRAG_THRESHOLD_PX = 4;
  const DEFAULT_CENTERS = [0.875, 0.625, 0.375, 0.125];
  let markers = [];
  let lanes = [];
  let columns = ["逃げ", "先行", "差し", "追込"];
  let centers = DEFAULT_CENTERS;
  let raceId = null;           // 馬柱のどの行を探すか（別のレースへ飛ばさないための目印）
  let waitingSave = false;     // 送った保存が返ってくるのを待っている
  let appliedVersion = null;   // 最後に描いた中身の符号（同じなら描き直さない）
  let appliedRev = -1;         // 最後に描いたときの番号（これ以下の描画は古いので捨てる）
  let phone = false;

  function send(type, data) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
  }
  function setHeight() {
    send("streamlit:setFrameHeight", { height: document.getElementById("root").scrollHeight + 8 });
  }
  /** body の目印を付け外しする（テスト用の最小のDOMには body が無いので確かめてから）。 */
  function bodyClass(name, on) {
    const body = document.body;
    if (body && body.classList && body.classList.toggle) body.classList.toggle(name, !!on);
  }

  /** 盤の中身をStreamlitへ送って保存する（**自動保存**。保存ボタンは無い）。 */
  function save() {
    waitingSave = true;
    send("streamlit:setComponentValue", {
      value: {
        saved_at: Date.now(),      // 同じ中身でも「保存された」ことが分かるように
        markers: markers.map(function (m) {
          return {
            horse_id: m.horse_id, tier: m.tier, position: m.position,
            lane_offset: m.lane_offset, comment: m.comment, is_manual: m.is_manual,
            is_excluded: m.is_excluded,
          };
        }),
      },
      dataType: "json",
    });
  }

  // --- 描く --------------------------------------------------------------------

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function inCell(tier, column) {
    return markers.filter(function (m) { return m.tier === tier && m.column === column; })
      .sort(function (a, b) { return (a.order - b.order) || ((a.umaban || 0) - (b.umaban || 0)); });
  }
  function draw() {
    const board = document.getElementById("board");
    board.innerHTML = "";
    lanes.forEach(function (lane) {
      const tier = el("div", "tier");
      tier.dataset.tier = lane.key;
      const inner = el("div", "tier-in");
      const key = el("b", "tier-key", lane.key);
      key.title = lane.key + " " + lane.label + "：" + lane.meaning;
      inner.appendChild(key);
      const cols = el("div", "cols");
      for (let c = 0; c < columns.length; c++) {
        const col = el("div", "col");
        col.dataset.col = String(c);
        col.dataset.tier = lane.key;
        col.title = columns[c];
        inCell(lane.key, c).forEach(function (marker) { col.appendChild(chip(marker)); });
        cols.appendChild(col);
      }
      inner.appendChild(cols);
      tier.appendChild(inner);
      board.appendChild(tier);
    });
    if (phone) {
      fitNames();
      // 日本語の字体（Noto Sans JP）が読み込まれると字の幅が変わるので、読み込み後にもう一度測る
      try { if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNames); } catch (e) { /* 無くてもよい */ }
      setTimeout(fitNames, 400);
    }
    setHeight();
  }
  /**
   * スマホで、列の幅に入らない馬名を横に縮めて1行に収める（隣の列にはみ出さないように）。
   * 縮めすぎると読めないので 60% までにする。幅を測れない環境（テストの最小のDOM）では何もしない。
   * 列は約80px、馬番の丸を除くと馬名に使えるのは約54px。9文字の馬名は92%でも約70pxあるので、
   * 資料の 97%／92% だけでは隣の列にはみ出していた（2026-10）。
   */
  function fitNames() {
    document.querySelectorAll(".chip").forEach(function (node) {
      const name = node.querySelector(".name");
      const num = node.querySelector(".num");
      if (!name || !name.scrollWidth || !node.clientWidth) return;
      // 馬名に使える幅＝チップの内側の幅 − 左右の余白（3px×2）− 馬番の丸 − すき間（2px）
      const room = node.clientWidth - 6 - (num ? num.offsetWidth : 0) - 2;
      const scale = room / name.scrollWidth;
      const now = parseFloat((name.style.transform || "").replace(/[^\d.]/g, "")) || 1;
      if (scale < now) name.style.transform = "scaleX(" + Math.max(0.6, Math.floor(scale * 100) / 100) + ")";
    });
  }
  function chip(marker) {
    const node = el("div", "chip");
    node.dataset.horse = marker.horse_id;
    const num = el("span", "num", marker.umaban == null ? "?" : String(marker.umaban));
    num.style.background = marker.color;
    num.style.color = marker.text_color;
    node.appendChild(num);
    const name = el("span", "name", marker.horse_name);
    // スマホは馬名を1行に収める（8文字は横97%、9文字以上は横92%。資料）。
    // それでも列の幅に入らない名前は、描いたあとに fitNames が収まるまで縮める
    const length = (marker.horse_name || "").length;
    if (phone && length >= 8) name.style.transform = "scaleX(" + (length >= 9 ? 0.92 : 0.97) + ")";
    node.appendChild(name);
    node.title = (marker.style ? "脚質 " + marker.style + "／" : "") + (marker.explanation || "");
    marker.el = node;
    applyLook(marker);
    node.addEventListener("pointerdown", function (event) { startDrag(event, marker); });
    return node;
  }
  /** 馬の見た目（動かしたか・D段か）。**ここ1か所だけ**で決める。 */
  function applyLook(marker) {
    if (!marker.el) return;
    marker.el.classList.toggle("manual", !!marker.is_manual && marker.tier !== "D");
    marker.el.classList.toggle("dim", marker.tier === "D" || !!marker.is_excluded);
  }

  // --- ドラッグ ------------------------------------------------------------------

  function inside(rect, x, y) {
    return x >= rect.left && x <= rect.left + rect.width && y >= rect.top && y <= rect.top + rect.height;
  }
  /** 指（ポインター）の下にある列。段のカードの中で列のすき間に落としたときは、横にいちばん近い列。 */
  function columnAt(x, y) {
    const cols = document.querySelectorAll(".col");
    for (let i = 0; i < cols.length; i++) {
      if (inside(cols[i].getBoundingClientRect(), x, y)) return cols[i];
    }
    const tiers = document.querySelectorAll(".tier");
    for (let t = 0; t < tiers.length; t++) {
      if (!inside(tiers[t].getBoundingClientRect(), x, y)) continue;
      let best = null, gap = Infinity;
      tiers[t].querySelectorAll(".col").forEach(function (col) {
        const r = col.getBoundingClientRect();
        const d = Math.abs(x - (r.left + r.width / 2));
        if (d < gap) { gap = d; best = col; }
      });
      return best;
    }
    return null;
  }
  /** 列の中で、何番目に入れるか（その列の馬の縦の真ん中と比べる）。 */
  function insertIndex(col, y, self) {
    const chips = Array.prototype.filter.call(col.children || [], function (c) {
      return c !== self && c.className && c.className.indexOf("chip") === 0;
    });
    for (let i = 0; i < chips.length; i++) {
      const r = chips[i].getBoundingClientRect();
      if (y < r.top + r.height / 2) return i;
    }
    return chips.length;
  }
  /** 落とした列と位置に合わせて、段・列・並び順を書き換える（前後の馬の順番は変えない）。 */
  function placeAt(marker, tier, column, index) {
    const others = inCell(tier, column).filter(function (m) { return m !== marker; });
    let order;
    if (!others.length) order = 0;
    else if (index <= 0) order = others[0].order - 1;
    else if (index >= others.length) order = others[others.length - 1].order + 1;
    else order = (others[index - 1].order + others[index].order) / 2;
    marker.tier = tier;
    marker.column = column;
    marker.order = Math.round(order * 1000) / 1000;
    marker.position = centers[column];
    marker.lane_offset = marker.order;
    marker.is_manual = true;
  }
  function startDrag(event, marker) {
    if (event.preventDefault) event.preventDefault();
    const node = marker.el;
    if (node.setPointerCapture) node.setPointerCapture(event.pointerId);
    const startX = event.clientX, startY = event.clientY;
    let moved = false, ghost = null, over = null;

    function onMove(e) {
      if (!moved) {
        if (Math.abs(e.clientX - startX) < DRAG_THRESHOLD_PX && Math.abs(e.clientY - startY) < DRAG_THRESHOLD_PX) return;
        moved = true;
        node.classList.add("lifted");
        if (document.body && node.cloneNode) {
          ghost = node.cloneNode(true);
          ghost.classList.add("ghost");
          document.body.appendChild(ghost);
        }
      }
      if (ghost) { ghost.style.left = e.clientX + "px"; ghost.style.top = e.clientY + "px"; }
      const col = columnAt(e.clientX, e.clientY);
      if (col !== over) {
        if (over) over.classList.remove("over");
        if (col) col.classList.add("over");
        over = col;
      }
      node.dataset.dropX = String(e.clientX);
      node.dataset.dropY = String(e.clientY);
    }
    function onUp() {
      node.removeEventListener("pointermove", onMove);
      node.removeEventListener("pointerup", onUp);
      node.removeEventListener("pointercancel", onUp);
      node.classList.remove("lifted");
      if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
      if (over) over.classList.remove("over");
      // 押しただけ → PCは馬柱のその馬へ、スマホはその馬の詳細を開く（スマホには馬柱の表が無いため）
      if (!moved) { if (phone) openDetail(marker); else jumpToGrid(marker); return; }
      if (!over) return;                                 // 盤の外で離した → 元のまま
      const y = parseFloat(node.dataset.dropY);
      placeAt(marker, over.dataset.tier, parseInt(over.dataset.col, 10), insertIndex(over, y, node));
      draw();
      save();                                            // 動かし終わったら自動で保存
    }
    node.addEventListener("pointermove", onMove);
    node.addEventListener("pointerup", onUp);
    node.addEventListener("pointercancel", onUp);
  }

  // --- 馬柱との行き来 --------------------------------------------------------------

  /** スマホ: 押した馬の詳細を開くよう Python へ伝える（保存とは別の値。`saved_at` は付けない）。 */
  function openDetail(marker) {
    if (!marker.horse_id) return;
    send("streamlit:setComponentValue", {
      value: { open: marker.horse_id, race_id: raceId, at: Date.now() },
      dataType: "json",
    });
  }

  /**
   * 同じページの**馬柱のその馬の行**へ飛ぶ。行のidにはレースIDが入っている（`past_grid.grid_row_id`）ので、
   * 盤のレースIDと合わない馬柱しか出ていなければ見つからず、何もしない（別のレースへ飛ばない）。
   */
  function jumpToGrid(marker) {
    let doc;
    try { doc = window.parent && window.parent.document; } catch (e) { return; }
    if (!doc || !raceId || !marker.horse_id) return;
    const row = doc.getElementById("pg-" + raceId + "-" + marker.horse_id);
    if (!row) return;
    // 馬柱のタブが閉じている（予想やオッズを見ている）ときは、先にタブを開く
    let wait = 0;
    if (!row.offsetParent) {
      const tabs = doc.querySelectorAll('[data-testid="stTab"]');
      for (let i = 0; i < tabs.length; i++) {
        if ((tabs[i].textContent || "").indexOf("馬柱") === 0) { tabs[i].click(); wait = 200; break; }
      }
    }
    function go() {
      row.scrollIntoView({ behavior: "smooth", block: "center" });
      row.classList.add("pg-jumped");
      setTimeout(function () { row.classList.remove("pg-jumped"); }, 2400);
    }
    go();
    if (wait) setTimeout(function () { row.scrollIntoView({ behavior: "smooth", block: "center" }); }, wait);
  }

  /**
   * 馬柱の**枠**（`.board-link`）を押したら、予想のタブを開いてその馬を光らせる（jumpToGrid の逆向き）。
   * `data-race` が盤のレースIDと違うときは何もしない。描き直すたびに受け口を付け直す。
   */
  function installBoardLinks() {
    let win, doc;
    try { win = window.parent; doc = win && win.document; } catch (e) { return; }
    if (!doc || !doc.addEventListener) return;
    if (win.__keibaBoardLink && doc.removeEventListener) {
      doc.removeEventListener("click", win.__keibaBoardLink, true);
    }
    win.__keibaBoardLink = function (event) {
      const target = event.target;
      const link = target && target.closest ? target.closest(".board-link") : null;
      if (!link) return;
      const data = link.dataset || {};
      if (!raceId || data.race !== raceId) return;
      const marker = markers.filter(function (m) { return m.horse_id === data.horse; })[0];
      if (!marker || !marker.el) return;
      if (event.preventDefault) event.preventDefault();
      // 予想のタブが閉じていれば開く（タブの名前は PC・スマホとも「予想」）
      let wait = 0;
      const tabs = doc.querySelectorAll('[data-testid="stTab"]');
      for (let i = 0; i < tabs.length; i++) {
        const label = (tabs[i].textContent || "").trim();
        if (label === "予想" || label.indexOf("予想ボード") === 0) {
          const open = tabs[i].getAttribute && tabs[i].getAttribute("aria-selected") === "true";
          if (!open) { tabs[i].click(); wait = 200; }
          break;
        }
      }
      setTimeout(function () {
        const frame = window.frameElement;
        if (frame && frame.scrollIntoView) frame.scrollIntoView({ behavior: "smooth", block: "center" });
      }, wait);
      marker.el.classList.add("flash");
      setTimeout(function () { marker.el.classList.remove("flash"); }, 2400);
    };
    doc.addEventListener("click", win.__keibaBoardLink, true);
  }

  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "streamlit:render") return;
    const payload = (event.data.args || {}).payload || {};
    raceId = payload.race_id || raceId;
    installBoardLinks();
    // **自分の保存が返ってきただけ**なら、盤は画面にもう出ているので描き直さない
    // （このとき届く中身は保存**前**のものでもあるので、なおさら当ててはいけない）
    if (waitingSave) {
      waitingSave = false;
      if (payload.rev != null) appliedRev = payload.rev;
      setHeight();
      return;
    }
    // 古い番号の描画は捨てる（順番が入れ替わって届くことがあるため）
    if (payload.rev != null && payload.rev <= appliedRev) return;
    if (payload.rev != null) appliedRev = payload.rev;
    if (payload.version && payload.version === appliedVersion) return;
    appliedVersion = payload.version || null;
    lanes = payload.lanes || [];
    columns = payload.columns || columns;
    centers = payload.column_centers || DEFAULT_CENTERS;
    phone = payload.layout === "phone";
    bodyClass("phone", phone);
    markers = (payload.markers || []).map(function (m) { return Object.assign({}, m); });
    draw();
  });

  // 最初は隠れているタブ（PCの予想）の中で描かれると、高さを0のまま送ってしまう。
  // 見えるようになると部品の枠の幅が変わる（resize）ので、高さを送り直す
  window.addEventListener("resize", function () {
    if (window.innerWidth > 50) setHeight();
  });

  send("streamlit:componentReady", { apiVersion: 1 });
  setHeight();
})();
</script>
</body>
</html>
